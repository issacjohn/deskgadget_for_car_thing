<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DeskGadget</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a0f; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    color: #eaf0f8;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(280px 200px at 50% 46%, rgba(124, 92, 255, 0.22), transparent 70%),
      radial-gradient(260px 180px at 62% 58%, rgba(124, 231, 255, 0.12), transparent 70%);
  }
  .mark { position: relative; width: 116px; height: 88px; }
  .mark svg { display: block; width: 100%; height: 100%; }
  .name {
    position: relative;
    margin-top: 26px;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .kind {
    position: relative;
    margin-top: 7px;
    font-size: 10px;
    letter-spacing: 3.4px;
    color: #7d8aa0;
  }
  .bar {
    position: relative;
    width: 168px;
    height: 3px;
    margin-top: 26px;
    border-radius: 2px;
    background: #151b25;
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff3d8b, #7c5cff 55%, #7ce7ff);
    animation: fill 0.95s ease-out forwards;
  }
  @keyframes fill { to { width: 100%; } }
  .wait {
    position: relative;
    margin-top: 14px;
    font-size: 11px;
    color: #5f6b7d;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .wait.is-on { opacity: 1; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="mark">
    <svg viewBox="0 0 116 88" aria-hidden="true">
      <defs>
        <linearGradient id="screen" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#ff3d8b"/>
          <stop offset="0.52" stop-color="#8f5bff"/>
          <stop offset="1" stop-color="#7ce7ff"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="112" height="84" rx="20"
            fill="url(#screen)" stroke="rgba(255,255,255,0.55)" stroke-width="2.5"/>
      <circle cx="46" cy="66" r="4.6" fill="#ffffff" opacity="0.95"/>
      <circle cx="60" cy="66" r="4.6" fill="#ffffff" opacity="0.72"/>
      <circle cx="74" cy="66" r="4.6" fill="#ffffff" opacity="0.45"/>
    </svg>
  </div>

  <div class="name">DeskGadget</div>
  <div class="kind">CAR THING</div>
  <div class="bar"><i></i></div>
  <div class="wait" id="wait">Waiting for DeskGadget…</div>

<script>
  var CLIENT = 'file:///var/deskgadget/index.html';
  var wait = document.getElementById('wait');

  function go() {
    var xhr = new XMLHttpRequest();
    try {
      xhr.open('GET', CLIENT, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        // file:// answers 0 on success in this build
        if (xhr.status === 200 || xhr.status === 0) {
          location.replace(CLIENT);
        } else {
          wait.className = 'wait is-on';
          setTimeout(go, 1500);
        }
      };
      xhr.send();
    } catch (error) {
      wait.className = 'wait is-on';
      setTimeout(go, 1500);
    }
  }

  if (location.search.indexOf('stay') < 0) setTimeout(go, 950);
</script>
</body>
</html>
